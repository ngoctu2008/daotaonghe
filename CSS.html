<style>
  :root {
    --primary-blue: #0d6efd;
    --dark-blue: #0a58ca;
    --light-bg: #f8f9fa;
  }
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #333; }

  /* Navbar styling */
  .navbar { background-color: rgba(0, 0, 0, 0.4); transition: all 0.3s ease; padding: 15px 0; }
  .navbar.navbar-scrolled {
    background-color: rgba(255, 255, 255, 1);
    box-shadow: 0 2px 15px rgba(0,0,0,0.08); padding: 10px 0;
  }
  .navbar-brand, .nav-link { font-weight: bold; color: #ffffff !important; text-shadow: 0 2px 4px rgba(0,0,0,0.8); transition: color 0.3s; }
  .navbar.navbar-scrolled .navbar-brand { color: var(--primary-blue) !important; text-shadow: none; }
  .navbar.navbar-scrolled .nav-link { color: #111111 !important; text-shadow: none; }
  .nav-link:hover { color: var(--primary-blue) !important; transform: translateY(-2px); }

  /* Hero Section */
  .hero-section {
    position: relative; height: 100vh; min-height: 600px;
    background: url('https://images.unsplash.com/photo-1523050854058-8df90110c9f1?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') no-repeat center center/cover;
    background-attachment: fixed;
  }
  #hero-canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; overflow: hidden; }
  .hero-overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(135deg, rgba(2, 10, 30, 0.8) 0%, rgba(0, 5, 15, 0.95) 100%);
    z-index: 1; pointer-events: none;
  }
  .btn-hero { transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2); }
  .btn-hero:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(255, 255, 255, 0.4); }
  .hero-title { font-size: 3.5rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }

  /* Sections */
  .section-title { color: var(--primary-blue); font-weight: bold; position: relative; display: inline-block; }
  .section-title::after { content: ''; position: absolute; width: 50%; height: 3px; background-color: var(--primary-blue); bottom: -10px; left: 25%; }
  .bg-light-section { background-color: #f4f7f6; }

  /* Cards */
  .course-card { border: none; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); transition: all 0.4s ease; height: 100%; overflow: hidden; cursor: pointer; }
  .course-card:hover { transform: translateY(-10px); box-shadow: 0 15px 35px rgba(13, 110, 253, 0.15); }
  .course-icon-wrapper { width: 70px; height: 70px; background-color: var(--light-bg); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; }
  .course-icon-wrapper i { font-size: 30px; color: var(--primary-blue); }

  /* Facilities */
  .facility-img { height: 250px; object-fit: cover; }
  .tech-highlight-box { background: linear-gradient(135deg, var(--primary-blue), var(--dark-blue)); }
  model-viewer { width: 100%; height: 400px; background-color: #eee; border-radius: 10px; --poster-color: transparent; }

  /* Staff & Partners */
  .counter-box { text-align: center; padding: 20px; }
  .counter-box i { font-size: 40px; color: var(--primary-blue); margin-bottom: 15px; }
  .counter-number { font-size: 3rem; font-weight: bold; color: #333; }
  .partner-logo { width: 150px; height: 100px; object-fit: contain; filter: grayscale(100%); opacity: 0.7; transition: all 0.3s; }
  .partner-logo:hover { filter: grayscale(0%); opacity: 1; }

  /* Footer */
  footer { background-color: #0b132b; color: #f8f9fa; }
  .footer-contact i { color: #3d8bfd; width: 20px;}

  /* Admin */
  #admin-dashboard .list-group-item.active { background-color: var(--primary-blue); border-color: var(--primary-blue); }
  .table-hover tbody tr:hover { background-color: #f1f3f5; }

  @media (max-width: 768px) { .hero-title { font-size: 2.5rem; } }
</style>
