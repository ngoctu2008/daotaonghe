<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      body { background-color: #f8f9fa; padding: 20px; }
      .register-container { max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <div class="register-container">
      <div class="text-center mb-4">
        <h4>Đăng ký thông tin học viên</h4>
        <p class="text-muted">Mã lớp: <strong><?= courseId ?></strong></p>
      </div>

      <div id="registerForm">
        <div class="mb-3">
          <label class="form-label">Họ và tên <span class="text-danger">*</span></label>
          <input type="text" class="form-control" id="fullName" required>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Ngày sinh <span class="text-danger">*</span></label>
            <input type="date" class="form-control" id="dob" required>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Giới tính</label>
            <select class="form-select" id="gender">
              <option value="Nam">Nam</option>
              <option value="Nữ">Nữ</option>
            </select>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Số CCCD <span class="text-danger">*</span></label>
          <input type="text" class="form-control" id="cccd" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Số điện thoại</label>
          <input type="text" class="form-control" id="phone">
        </div>

        <div class="mb-3">
          <label class="form-label">Địa chỉ thường trú</label>
          <textarea class="form-control" id="address" rows="2"></textarea>
        </div>

        <button class="btn btn-primary w-100" id="btnSubmit" onclick="submitForm()">Gửi đăng ký</button>
        <div id="statusMsg" class="mt-3 text-center"></div>
      </div>

      <!-- Màn hình thành công -->
      <div id="successScreen" class="text-center hidden mt-4">
        <h4 class="text-success">✔ Đăng ký thành công!</h4>
        <p>Thông tin của bạn đã được gửi đến giáo viên phụ trách lớp.</p>
        <p>Bạn có thể đóng trang này.</p>
      </div>

    </div>

    <script>
      function submitForm() {
        // Validation cơ bản
        let fullName = document.getElementById('fullName').value.trim();
        let dob = document.getElementById('dob').value;
        let cccd = document.getElementById('cccd').value.trim();

        if (!fullName || !dob || !cccd) {
          alert("Vui lòng điền đầy đủ Họ tên, Ngày sinh và Số CCCD.");
          return;
        }

        let studentData = {
          courseId: "<?= courseId ?>", // Biến này lấy từ file Code.gs truyền vào template
          fullName: fullName,
          dob: dob,
          gender: document.getElementById('gender').value,
          cccd: cccd,
          phone: document.getElementById('phone').value.trim(),
          address: document.getElementById('address').value.trim()
        };

        // UI Feedback
        let btn = document.getElementById('btnSubmit');
        let status = document.getElementById('statusMsg');
        btn.disabled = true;
        btn.innerText = "Đang xử lý...";

        google.script.run.withSuccessHandler(function(res) {
          if (res.success) {
            document.getElementById('registerForm').classList.add('hidden');
            document.getElementById('successScreen').classList.remove('hidden');
          } else {
            status.innerHTML = `<span class="text-danger">Lỗi: ${res.message}</span>`;
            btn.disabled = false;
            btn.innerText = "Gửi đăng ký";
          }
        }).registerStudent(studentData);
      }
    </script>
  </body>
</html>
