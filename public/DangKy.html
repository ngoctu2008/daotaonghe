<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký Học Nghề - Trung tâm GDNN-GDTX Đăk Hà</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- AOS CSS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <!-- Custom CSS -->
    <style>
        :root {
            --primary-color: #004085; /* Màu xanh giáo dục */
            --secondary-color: #0d6efd;
            --bg-light: #f8f9fa;
        }
        body {
            background-color: var(--bg-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
        }
        .header-banner {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 2rem 0;
            text-align: center;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .header-banner img {
            max-width: 80px;
            margin-bottom: 1rem;
        }
        .form-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            padding: 2rem;
            margin-bottom: 3rem;
            border-top: 5px solid var(--primary-color);
        }
        .section-title {
            color: var(--primary-color);
            border-bottom: 2px solid var(--secondary-color);
            padding-bottom: 0.5rem;
            margin-bottom: 1.5rem;
            font-weight: 600;
        }
        .form-label {
            font-weight: 500;
        }
        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            padding: 0.75rem 2rem;
            font-weight: 600;
            border-radius: 50px;
            transition: all 0.3s;
        }
        .btn-primary:hover {
            background-color: var(--secondary-color);
            border-color: var(--secondary-color);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(13, 110, 253, 0.4);
        }
        footer {
            background-color: #343a40;
            color: #fff;
            padding: 1.5rem 0;
            text-align: center;
        }
        /* Loader */
        #loader {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.8);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div id="loader">
        <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <header class="header-banner" data-aos="fade-down">
        <div class="container">
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a1/Logo_BGD%C4%90T.svg/200px-Logo_BGD%C4%90T.svg.png" alt="Logo" id="site-logo">
            <h2 id="site-title" class="fw-bold">Hệ thống Quản lý Đào tạo Nghề</h2>
            <p class="mb-0">Trung tâm GDNN-GDTX khu vực Đăk Hà</p>
            <h4 class="mt-3 text-warning">Phiếu Đăng Ký Học Nghề Trực Tuyến</h4>
        </div>
    </header>

    <div class="container" data-aos="fade-up" data-aos-delay="100">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">
                <div class="form-card">
                    <form id="frmDangKy">
                        <!-- Chọn Khóa Học -->
                        <h4 class="section-title"><i class="fas fa-book-open me-2"></i>Thông tin Khóa học</h4>
                        <div class="mb-4">
                            <label for="MaKhoa" class="form-label text-danger">Đăng ký lớp học (*)</label>
                            <select class="form-select" id="MaKhoa" required>
                                <option value="">-- Đang tải danh sách lớp... --</option>
                            </select>
                        </div>

                        <!-- Thông tin cá nhân -->
                        <h4 class="section-title"><i class="fas fa-user me-2"></i>Thông tin Cá nhân</h4>
                        <div class="row mb-3">
                            <div class="col-md-6 mb-3 mb-md-0">
                                <label for="HoTen" class="form-label">Họ và Tên (*)</label>
                                <input type="text" class="form-control" id="HoTen" required placeholder="NGUYỄN VĂN A">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label d-block">Giới tính (*)</label>
                                <div class="form-check form-check-inline mt-2">
                                    <input class="form-check-input" type="radio" name="GioiTinh" id="Nam" value="Nam" required>
                                    <label class="form-check-label" for="Nam">Nam</label>
                                </div>
                                <div class="form-check form-check-inline mt-2">
                                    <input class="form-check-input" type="radio" name="GioiTinh" id="Nu" value="Nữ">
                                    <label class="form-check-label" for="Nu">Nữ</label>
                                </div>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6 mb-3 mb-md-0">
                                <label for="NgaySinh" class="form-label">Ngày sinh (*)</label>
                                <input type="date" class="form-control" id="NgaySinh" required>
                            </div>
                            <div class="col-md-6">
                                <label for="Dienthoai" class="form-label">Số điện thoại (*)</label>
                                <input type="tel" class="form-control" id="Dienthoai" required placeholder="09xxxxxxxxx">
                            </div>
                        </div>

                        <!-- CCCD & Quê quán -->
                        <h4 class="section-title mt-4"><i class="fas fa-id-card me-2"></i>Giấy tờ & Nơi ở</h4>
                        <div class="row mb-3">
                            <div class="col-md-4 mb-3 mb-md-0">
                                <label for="SoCC" class="form-label">Số CCCD/Căn cước (*)</label>
                                <input type="text" class="form-control" id="SoCC" required>
                            </div>
                            <div class="col-md-4 mb-3 mb-md-0">
                                <label for="NgayCC" class="form-label">Ngày cấp</label>
                                <input type="date" class="form-control" id="NgayCC">
                            </div>
                            <div class="col-md-4">
                                <label for="NoiCC" class="form-label">Nơi cấp</label>
                                <input type="text" class="form-control" id="NoiCC" placeholder="Cục CS QLHC...">
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-4 mb-3 mb-md-0">
                                <label for="DanToc" class="form-label">Dân tộc (*)</label>
                                <input type="text" class="form-control" id="DanToc" required value="Kinh">
                            </div>
                            <div class="col-md-4 mb-3 mb-md-0">
                                <label for="TonGiao" class="form-label">Tôn giáo</label>
                                <input type="text" class="form-control" id="TonGiao" value="Không">
                            </div>
                            <div class="col-md-4">
                                <label for="TrinhDoVH" class="form-label">Trình độ VH (*)</label>
                                <select class="form-select" id="TrinhDoVH" required>
                                    <option value="">-- Chọn --</option>
                                    <option value="Chưa qua đào tạo">Chưa qua đào tạo</option>
                                    <option value="Tiểu học">Tiểu học</option>
                                    <option value="THCS">THCS</option>
                                    <option value="THPT">THPT</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="HKTT" class="form-label">Hộ khẩu thường trú (*)</label>
                            <input type="text" class="form-control" id="HKTT" required placeholder="Thôn/Xã, Huyện, Tỉnh">
                        </div>
                        <div class="mb-3">
                            <label for="NoiCuTru" class="form-label">Chỗ ở hiện tại (*)</label>
                            <input type="text" class="form-control" id="NoiCuTru" required placeholder="Thôn/Xã, Huyện, Tỉnh">
                            <div class="form-check mt-2">
                                <input class="form-check-input" type="checkbox" id="chkGiongHKTT">
                                <label class="form-check-label text-muted" style="font-size: 0.9rem;" for="chkGiongHKTT">Giống Hộ khẩu thường trú</label>
                            </div>
                        </div>

                        <!-- Chính sách & Việc làm -->
                        <h4 class="section-title mt-4"><i class="fas fa-hand-holding-heart me-2"></i>Định hướng & Chính sách</h4>
                        <div class="mb-3">
                            <label for="MaDoiTuong" class="form-label">Thuộc đối tượng ưu tiên</label>
                            <select class="form-select" id="MaDoiTuong">
                                <option value="">Không thuộc đối tượng ưu tiên</option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label for="ViecLamDuKien" class="form-label">Dự kiến việc làm sau khi học (*)</label>
                            <select class="form-select" id="ViecLamDuKien" required>
                                <option value="">-- Chọn định hướng --</option>
                                <option value="Tự tạo việc làm">Tự tạo việc làm (Mở tiệm, làm kinh tế hộ...)</option>
                                <option value="Được doanh nghiệp, đơn vị bao tiêu sản phẩm">Được doanh nghiệp bao tiêu sản phẩm</option>
                                <option value="Được ký hợp đồng lao động">Được doanh nghiệp ký hợp đồng lao động</option>
                                <option value="Đi làm việc có thời hạn ở nước ngoài">Đi làm việc có thời hạn ở nước ngoài (XKLĐ)</option>
                            </select>
                        </div>

                        <div class="mb-4 form-check bg-light p-3 rounded border">
                            <input class="form-check-input ms-1" type="checkbox" id="chkDongY" required>
                            <label class="form-check-label ms-2 text-muted" for="chkDongY" style="font-size: 0.85rem; text-align: justify;">
                                Tôi cam kết các thông tin khai báo trên là chính xác và <strong>đồng ý cho Trung tâm GDNN-GDTX khu vực Đăk Hà thu thập, xử lý dữ liệu cá nhân</strong> (bao gồm CCCD, ngày sinh, dân tộc, nơi cư trú...) nhằm mục đích phục vụ công tác tuyển sinh, quản lý đào tạo nghề theo quy định của pháp luật (Nghị định 13/2023/NĐ-CP).
                            </label>
                        </div>

                        <div class="text-center mt-4">
                            <button type="submit" class="btn btn-primary btn-lg w-100">
                                <i class="fas fa-paper-plane me-2"></i>GỬI HỒ SƠ ĐĂNG KÝ
                            </button>
                        </div>

                        <div id="msgAlert" class="alert mt-3 d-none" role="alert"></div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <footer id="footer-text">
        © 2024 Trung tâm GDNN-GDTX khu vực Đăk Hà
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script type="module" src="js/dangky.js"></script>
    <script>
        AOS.init({ duration: 800, once: true });

        // Auto fill NoiCuTru
        document.getElementById('chkGiongHKTT').addEventListener('change', function() {
            if(this.checked) {
                document.getElementById('NoiCuTru').value = document.getElementById('HKTT').value;
            } else {
                document.getElementById('NoiCuTru').value = '';
            }
        });
    </script>
</body>
</html>
