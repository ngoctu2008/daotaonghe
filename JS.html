<script>
  document.addEventListener("DOMContentLoaded", function() {
    // Khởi tạo thư viện AOS (Animate On Scroll)
    AOS.init({
      duration: 800,
      easing: 'slide',
      once: true, // Chỉ animate 1 lần khi cuộn xuống
      offset: 50
    });

    // Xử lý cuộn trang mượt mà cho các anchor links trong Navbar
    document.querySelectorAll('a.nav-link[href^="#"]').forEach(anchor => {
      anchor.addEventListener('click', function (e) {
        e.preventDefault();

        // Đóng navbar collapse trên thiết bị di động sau khi click
        var navbarCollapse = document.querySelector('.navbar-collapse');
        if (navbarCollapse.classList.contains('show')) {
          var bsCollapse = new bootstrap.Collapse(navbarCollapse, {toggle: false});
          bsCollapse.hide();
        }

        var targetId = this.getAttribute('href');
        if (targetId === '#') return;

        var targetElement = document.querySelector(targetId);
        if (targetElement) {
          // Lấy chiều cao của thanh navbar cố định để cuộn không bị che khuất
          var headerOffset = document.querySelector('.navbar').offsetHeight;
          var elementPosition = targetElement.getBoundingClientRect().top;
          var offsetPosition = elementPosition + window.pageYOffset - headerOffset;

          window.scrollTo({
            top: offsetPosition,
            behavior: "smooth"
          });
        }
      });
    });
  });
</script>
